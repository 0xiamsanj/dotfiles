# status bar
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#2b2d31,fg=#dcddde"

# left: session pill, right: 24h clock
set -g status-left-length 30
set -g status-left "#[bg=#78424a,fg=#ffffff,bold] #S #[default]  "
set -g status-right-length 30
set -g status-right "#[fg=#e06c75,bold]%H:%M "

# windows
set -g window-status-separator " "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#78424a,fg=#ffffff,bold] #I:#W #[default]"
set -g window-status-style "fg=#949ba4,bg=#313338"
set -g window-status-current-style "fg=#ffffff,bg=#78424a,bold"
set -g window-status-activity-style "fg=#ffffff,bg=#313338"
set -g window-status-bell-style "fg=#ffffff,bg=#78424a,bold"

# pane borders
set -g pane-border-style "fg=#4e5058"
set -g pane-active-border-style "fg=#e06c75"

# messages, copy-mode selection, misc
set -g message-style "bg=#78424a,fg=#ffffff"
set -g message-command-style "bg=#313338,fg=#dcddde"
set -g mode-style "bg=#78424a,fg=#ffffff"
set -g clock-mode-colour "#e06c75"
set -g display-panes-colour "#949ba4"
set -g display-panes-active-colour "#e06c75"
