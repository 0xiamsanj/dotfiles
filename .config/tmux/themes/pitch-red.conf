# status bar
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#000000,fg=#d0d0d0"

# left: session pill, right: 24h clock
set -g status-left-length 30
set -g status-left "#[bg=#990000,fg=#ffffff,bold] #S #[default]  "
set -g status-right-length 30
set -g status-right "#[fg=#ff2233,bold]%H:%M "

# windows
set -g window-status-separator " "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#990000,fg=#ffffff,bold] #I:#W #[default]"
set -g window-status-style "fg=#888888,bg=#121212"
set -g window-status-current-style "fg=#ffffff,bg=#990000,bold"
set -g window-status-activity-style "fg=#ffffff,bg=#121212"
set -g window-status-bell-style "fg=#ffffff,bg=#990000,bold"

# pane borders
set -g pane-border-style "fg=#222222"
set -g pane-active-border-style "fg=#ff2233"

# messages, copy-mode selection, misc
set -g message-style "bg=#990000,fg=#ffffff"
set -g message-command-style "bg=#121212,fg=#d0d0d0"
set -g mode-style "bg=#990000,fg=#ffffff"
set -g clock-mode-colour "#ff2233"
set -g display-panes-colour "#888888"
set -g display-panes-active-colour "#ff2233"
