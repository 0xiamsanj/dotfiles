# status bar
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#242933,fg=#d8dee9"

# left: session pill, right: 24h clock
set -g status-left-length 30
set -g status-left "#[bg=#4c6a92,fg=#eceff4,bold] #S #[default]  "
set -g status-right-length 30
set -g status-right "#[fg=#a1baf0,bold]%H:%M "

# windows
set -g window-status-separator " "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#4c6a92,fg=#eceff4,bold] #I:#W #[default]"
set -g window-status-style "fg=#81a1c1,bg=#2e3440"
set -g window-status-current-style "fg=#eceff4,bg=#4c6a92,bold"
set -g window-status-activity-style "fg=#eceff4,bg=#2e3440"
set -g window-status-bell-style "fg=#eceff4,bg=#4c6a92,bold"

# pane borders
set -g pane-border-style "fg=#4c566a"
set -g pane-active-border-style "fg=#88c0d0"

# messages, copy-mode selection, misc
set -g message-style "bg=#4c6a92,fg=#eceff4"
set -g message-command-style "bg=#3b4252,fg=#d8dee9"
set -g mode-style "bg=#4c6a92,fg=#eceff4"
set -g clock-mode-colour "#88c0d0"
set -g display-panes-colour "#81a1c1"
set -g display-panes-active-colour "#88c0d0"
