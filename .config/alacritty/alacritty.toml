
[env]
  TERM = "xterm-256color"

[cursor]
blink_interval = 550
unfocused_hollow = false

[cursor.style]
blinking = "on"
shape = "Block"

[font]
size = 9.0

[font.normal]
family = "IBM Plex Mono"
style = "Regular"

[font.bold]
family = "IBM Plex Mono"
style = "Bold"

[font.italic]
family = "IBM Plex Mono"
style = "Italic"

[selection]
save_to_clipboard = false

[window]
decorations = "none"
dynamic_title = true
opacity = 0.85

[scrolling]
history = 10000
multiplier = 3

[general]
live_config_reload = true

import = [
    "~/.config/alacritty/colorschemes/nordic.toml",
]

[window.padding]
x = 6
y = 6
