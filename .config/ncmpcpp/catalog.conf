visualizer_data_source = "/tmp/mpd.fifo"
visualizer_output_name = "Visualizer feed"
visualizer_in_stereo = "yes"
visualizer_type = "spectrum"
visualizer_look = ▮▮
system_encoding = "UTF-8"
#playlist_display_mode = "classic"
browser_display_mode = "columns"

# Colors — Nordic blue (256-color; ncmpcpp values are SGR-1)
discard_colors_if_item_is_selected = "yes"
header_window_color = "110"
volume_color = "117"
state_line_color = "60"
state_flags_color = "117"
main_window_color = "252"
color1 = "110"
color2 = "109"
progressbar_color = "60"
progressbar_elapsed_color = "110:b"
statusbar_color = "110"
statusbar_time_color = "117:b"
player_state_color = "117:b"
alternative_ui_separator_color = "60:b"
window_border_color = "60"
active_window_border = "110"
visualizer_color = "110, 111, 117, 153, 189"
autocenter_mode = "yes"
centered_cursor = "yes"

# Bar
song_status_format = $b{{$8"%t"}} $3by {$4%a{ $3in $7%b{ (%y)}} $3}|{$8%f}
progressbar_look = "->"

# General
header_visibility = "no"
statusbar_visibility = "no"
execute_on_song_change = "~/.config/ncmpcpp/cover_obs.sh"
