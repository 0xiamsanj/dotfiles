# ~/.config/mpv/script-opts/uosc.conf
# theme: Nordic blue (matches dwm / rofi / tmux)
# note: no spaces around '=' — mpv includes them in the key name

# rounded corners like rofi / notifications
border_radius=6

# compact scale (small UI)
font_scale=0.8
controls_size=27
controls_margin=6
timeline_size=32
timeline_line_width=4
menu_item_height=30
menu_min_width=240
volume_size=32

# Nordic blue palette overrides (names show uosc defaults)
color=foreground=eceff4,background_text=d8dee9,curtain=242933,success=a3be8c,error=bf616a,match=a1baf0,heatmap=88c0d0
