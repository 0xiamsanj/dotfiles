# ~/.config/mpv/script-opts/osc.conf
# theme: Nordic blue (matches dwm / rofi / tmux)
# note: no spaces around '=' — mpv includes them in the key name

layout=bottombar
visibility=auto
hidetimeout=500
fadeduration=200
seekbarstyle=bar
timetotal=no
timems=no

background_color=#242933
timecode_color=#eceff4
time_pos_color=#eceff4
time_pos_outline_color=#242933
title_color=#d8dee9
buttons_color=#d8dee9
small_buttonsL_color=#81a1c1
small_buttonsR_color=#81a1c1
top_buttons_color=#81a1c1
held_element_color=#a1baf0
